[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "muzero-research"
version = "0.1.0"
description = "Comparing MCTS, heuristic beam search, genetic search, and NES controllers in MuZero"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "numpy>=2,<3",
  "torch>=2.7,<3",
  "gymnasium>=1.2,<2",
  "minigrid>=3,<4",
  "Box2D==2.3.10",
  "pygame-ce>=2.5,<3",
  "PyYAML>=6,<7",
  "ray>=2.40,<3",
  "tensorboard>=2.18,<3",
]

[project.optional-dependencies]
cpu = ["torch>=2.7,<3"]
cuda = ["torch>=2.7,<3"]
tuning = ["ray[tune]>=2.40,<3"]
analysis = ["pandas>=2.2,<4", "matplotlib>=3.9,<4", "scipy>=1.14,<2"]
database = ["sqlalchemy>=2,<3", "psycopg[binary]>=3.2,<4", "pandas>=2.2,<4"]
games = ["gymnasium[atari]>=1.2,<2", "opencv-python-headless>=4.10,<5"]
spiel = ["open-spiel>=1.6,<2; sys_platform == 'linux'"]
diagnostics = ["graphviz>=0.20,<1"]

[project.scripts]
muzero-research = "muzero_research.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-PyYAML>=6", "pre-commit>=4,<5", "build>=1.2,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/muzero_research"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'", "sys_platform == 'win32' and platform_machine == 'AMD64'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cuda", extra = "cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".tools", "docs/baseline"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src/muzero_research/config.py", "src/muzero_research/contracts.py"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: environment and training checks", "ray: requires Ray workers", "gpu: requires NVIDIA hardware"]
filterwarnings = ["ignore:.*builtin type.*:DeprecationWarning"]
