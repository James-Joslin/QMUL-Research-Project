seed: 0
output_dir: runs
environment:
  name: atari
  observation_shape:
  - 1
  - 96
  - 96
  action_space:
  - 0
  - 1
  - 2
  - 3
  players:
  - 0
  observation_layout: CHW
  reward_scale: 1
  max_steps: 27000
  stacked_observations: 0
network:
  kind: resnet
  encoding_size: 10
  support_size: 300
  fc_representation_layers: []
  fc_dynamics_layers:
  - 16
  fc_reward_layers:
  - 16
  fc_value_layers: []
  fc_policy_layers: []
  blocks: 16
  channels: 256
  reduced_channels_reward: 256
  reduced_channels_value: 256
  reduced_channels_policy: 256
  resnet_fc_reward_layers:
  - 256
  - 256
  resnet_fc_value_layers:
  - 256
  - 256
  resnet_fc_policy_layers:
  - 256
  - 256
  downsample: resnet
training:
  steps: 1000000
  batch_size: 1024
  replay_capacity: 1000000
  unroll_steps: 5
  td_steps: 10
  discount: 0.997
  optimizer: SGD
  learning_rate: 0.05
  lr_decay_rate: 0.1
  lr_decay_steps: 350000.0
  weight_decay: 0.0001
  momentum: 0.9
  value_loss_weight: 0.25
  prioritized_replay: true
  priority_alpha: 1
  reanalyse: true
  checkpoint_interval: 1000
  temperature_threshold: null
runtime:
  device: cpu
  workers: 1
  fitness_workers: 1
  cpus: 2
  population_backend: local
  startup_timeout: 120.0
  ray_object_store_bytes: null
  torch_threads: 1
decision:
  method: mcts
  simulations: 50
  dirichlet_alpha: 0.25
  exploration_fraction: 0.25
  pb_c_base: 19652
  pb_c_init: 1.25
  max_depth: 12
  beam_width: 2
  reward_heuristic_weight: 1.0
  value_heuristic_weight: 1.0
  population_size: 10
  generations: 5
  horizon: 15
  tournament_size: 6
  mutation_rate: 0.2
  controller_width: 32
  controller_hidden_layers: 0
  noise_std: 0.1
  es_learning_rate: 0.1
  noise_decay: 1.0
  es_lr_decay: 1.0
