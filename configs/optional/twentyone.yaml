seed: 0
output_dir: runs
environment:
  name: twentyone
  observation_shape:
  - 3
  - 3
  - 3
  action_space:
  - 0
  - 1
  players:
  - 0
  observation_layout: CHW
  reward_scale: 1
  max_steps: 21
  stacked_observations: 0
network:
  kind: resnet
  encoding_size: 32
  support_size: 10
  fc_representation_layers:
  - 16
  fc_dynamics_layers:
  - 16
  fc_reward_layers:
  - 16
  fc_value_layers:
  - 16
  fc_policy_layers:
  - 16
  blocks: 2
  channels: 32
  reduced_channels_reward: 32
  reduced_channels_value: 32
  reduced_channels_policy: 32
