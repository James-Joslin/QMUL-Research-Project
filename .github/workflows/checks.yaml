name: Development checks
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.0"
          enable-cache: true
      - run: uv sync --locked --extra cpu --extra analysis --extra tuning --extra diagnostics
      - run: uv run --locked --extra cpu ruff check src tests scripts examples
      - run: uv run --locked --extra cpu ruff format --check src tests scripts examples
      - run: uv run --locked --extra cpu mypy
      - run: uv run --locked --extra cpu --extra analysis --extra tuning --extra diagnostics pytest -m 'not gpu'
      - run: uv build --no-sources
      - name: Test wheel outside the source tree
        run: |
          uv venv /tmp/muzero-wheel
          uv pip install --python /tmp/muzero-wheel/bin/python --no-deps dist/*.whl
          PYTHONPATH="$PWD/.venv/lib/python3.12/site-packages" /tmp/muzero-wheel/bin/python -c "from muzero_research import Experiment; from muzero_research.config import preset; print(Experiment(preset(smoke=True)).config.decision.method)"
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match host file ownership
        run: |
          echo "LOCAL_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "LOCAL_GID=$(id -g)" >> "$GITHUB_ENV"
      - run: docker compose config --quiet
      - run: docker compose build dev
      - name: Verify fresh development workflow
        run: |
          docker compose run --rm -T dev pytest -m 'not ray and not gpu' -q
          docker compose run --rm -T dev muzero-research train --config configs/smoke/mcts-gridworld.yaml --output runs/container-smoke --no-tensorboard
          docker compose run --rm -T dev muzero-research evaluate --checkpoint runs/container-smoke/model.checkpoint --output runs/container-smoke/evaluation.csv
          docker compose run --rm -T dev muzero-research plot runs/container-smoke/evaluation.csv --output runs/container-smoke/returns.png
